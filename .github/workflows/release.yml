name: Release to npm

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          VERSION=$(jq -r .version package.json)
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
        env:
          TAG: ${{ github.ref_name }}

      - run: bun run build

      - run: bun run test

      - name: Determine release channel
        id: channel
        run: |
          if [[ "$TAG" == *"alpha"* ]]; then
            echo "npm_tag=alpha" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *"beta"* ]]; then
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ github.ref_name }}

      - name: Check if already published
        id: check
        run: |
          VERSION=$(jq -r .version package.json)
          if npm view "@waniwani/relay@$VERSION" version 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already published to npm, skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        run: npm publish --access public --tag ${{ steps.channel.outputs.npm_tag }} --provenance --ignore-scripts

      - name: Create GitHub Release
        if: steps.check.outputs.published == 'false'
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
